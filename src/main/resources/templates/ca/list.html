<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Authorities | CertMan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <div class="topbar">
            <h2>Certificate Authorities</h2>
            <a th:href="@{/ca/create}" class="btn btn-primary">+ Create CA</a>
        </div>

        <div class="content-area">
            <div th:if="${success}" class="alert alert-success">
                <span>✅</span> <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <span>❌</span> <span th:text="${error}"></span>
            </div>

            <div th:if="${#lists.isEmpty(cas)}" class="empty-state">
                <div class="empty-icon">🏛️</div>
                <h3>No Certificate Authorities</h3>
                <p>Create your first Root CA to start issuing certificates.</p>
                <a th:href="@{/ca/create}" class="btn btn-primary">+ Create Root CA</a>
            </div>

            <div th:unless="${#lists.isEmpty(cas)}" class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Common Name</th>
                                <th>Type</th>
                                <th>Algorithm</th>
                                <th>Status</th>
                                <th>Valid Until</th>
                                <th>Issued Certs</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ca : ${cas}">
                                <td>
                                    <a th:href="@{/ca/{id}(id=${ca.id})}" th:text="${ca.name}" style="font-weight:600;">name</a>
                                </td>
                                <td th:text="${ca.commonName}">CN</td>
                                <td>
                                    <span class="badge-type" th:text="${ca.rootCa ? 'Root CA' : 'Intermediate CA'}">Type</span>
                                </td>
                                <td class="text-mono" style="font-size:0.8rem;" th:text="${ca.keyAlgorithm.displayName}">RSA 4096</td>
                                <td>
                                    <span class="badge-status"
                                          th:classappend="${ca.status.name() == 'ACTIVE' ? 'badge-active' :
                                                           (ca.status.name() == 'EXPIRED' ? 'badge-expired' :
                                                           (ca.status.name() == 'REVOKED' ? 'badge-revoked' : 'badge-pending'))}"
                                          th:text="${ca.status.displayName}">Active</span>
                                </td>
                                <td class="text-mono" th:text="${#temporals.format(ca.notAfter, 'yyyy-MM-dd')}">2034-01-01</td>
                                <td th:text="${#lists.size(ca.issuedCertificates)}">0</td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/ca/{id}(id=${ca.id})}" class="btn btn-sm btn-outline">View</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
